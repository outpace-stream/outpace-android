name: Release Android app

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
      - name: Build signed APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.OUTPACE_ANDROID_KEYSTORE_BASE64 }}
          OUTPACE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OUTPACE_ANDROID_KEYSTORE_PASSWORD }}
          OUTPACE_ANDROID_KEY_ALIAS: ${{ secrets.OUTPACE_ANDROID_KEY_ALIAS }}
          OUTPACE_ANDROID_KEY_PASSWORD: ${{ secrets.OUTPACE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test -n "$KEYSTORE_BASE64" || { echo '::error::Configure Android release signing secrets before tagging.'; exit 1; }
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export OUTPACE_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          version="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease -PappVersion="$version"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/outpace-android-${version}.apk"
          (cd dist && sha256sum *.apk > "outpace-android-${version}.apk.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: signed-android-apk
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: signed-android-apk
          path: dist
      - name: Publish APK in the Android repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
